*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#172e30;font:16px/1.55 system-ui,sans-serif}main,nav{max-width:1080px;margin:auto;padding:0 5vw}nav{height:60px;display:flex;align-items:center;justify-content:space-between;font-weight:650}.top{border-bottom:1px solid #c9d1c9}.local{font-size:.82rem;color:#36645d}.hero{margin:36px 0 24px;padding:clamp(24px,5vw,55px);border-radius:18px;background:#143e40;color:#eff8ed}.hero h1{font:normal clamp(40px,7vw,78px)/1 Georgia,serif;letter-spacing:-.045em;margin:.15em 0 .3em}.hero p{max-width:60ch;color:#c9ddda}.hero time{color:#f1d09c}h2{font:normal 32px Georgia,serif;margin:34px 0 14px}h2 small{font:500 14px system-ui;color:#536c68}article,.consent{padding:clamp(18px,3vw,32px);margin:0 0 18px;background:#fffefa;border:1px solid #cbd4cb;border-radius:14px}header,form{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h3{margin:0;font-size:21px}h4{margin:20px 0 6px}label{display:flex;align-items:center;gap:11px;padding:10px 18px;border:1px solid #bbc9bd;border-radius:9px;flex:1;cursor:pointer}label small{display:block;font-family:monospace}input{accent-color:#176458;width:18px;height:18px}button{padding:14px 20px;background:#176458;color:white;border:0;border-radius:8px;font:600 15px system-ui;cursor:pointer}button:hover{background:#0d4d46}em{font:600 13px system-ui;background:#d8eee2;color:#21543b;padding:6px 12px;border-radius:18px}em.deny{background:#fae1d8;color:#842e19}pre{background:#112d31;color:#cce9dc;white-space:pre-wrap;overflow-wrap:anywhere;padding:15px;border-radius:8px;max-height:310px;overflow:auto;font:13px/1.55 ui-monospace,Consolas,monospace}summary{cursor:pointer;color:#216056}p{color:#45605c}main{padding-bottom:60px}
